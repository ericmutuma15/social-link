name: mbogi_link_mobile
description: Native Material 3 companion for Mbogi Link.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^2.0.3+1
  cached_network_image: ^3.4.0
  flutter_svg: ^2.0.0
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  video_player: ^2.9.1
  video_thumbnail: ^0.5.0
  path_provider: ^2.0.0
  http_parser: ^4.0.0
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Designer.svg
    - assets/Designer.png
